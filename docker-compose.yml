services:
  postgres:
    image: postgres:16
    container_name: tcr_db_dev
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: tcr_pgadmin_dev
    env_file: .env
    ports:
      - "8080:80"

  server:
    build: 
      context: ./server
      target: development
    container_name: tcr_server_dev
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    depends_on:
      - postgres

  scraper:
    build:
      context: ./scraper
    container_name: tcr_scraper_dev
    env_file: .env
    volumes:
      - ./scraper:/app
    command: tail -f /dev/null

volumes:
  postgres_data: